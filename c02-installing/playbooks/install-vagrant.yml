---
- name: Install Vagrant
  hosts: localhost
  connection: local
  become: true
  vars:
    vagrant_version: "2.4.9"
    vagrant_pkg_url:
      Debian: "https://releases.hashicorp.com/vagrant/{{ vagrant_version }}/vagrant_{{ vagrant_version }}-1_amd64.deb"
      RedHat: "https://releases.hashicorp.com/vagrant/{{ vagrant_version }}/vagrant_{{ vagrant_version }}-1.x86_64.rpm"

  tasks:
    - name: Ensure dependencies are installed
      ansible.builtin.package:
        name: "{{ 'curl' if ansible_os_family == 'Debian' else 'curl' }}"
        state: present

    - name: Download Vagrant package
      ansible.builtin.get_url:
        url: "{{ vagrant_pkg_url[ansible_os_family] }}"
        dest: "/tmp/vagrant.{{ 'deb' if ansible_os_family == 'Debian' else 'rpm' }}"
        mode: "0644"

    - name: Install Vagrant package
      block:
        - name: Install on Debian
          ansible.builtin.apt:
            deb: "/tmp/vagrant.deb"
          when: ansible_os_family == "Debian"

        - name: Install on RedHat
          ansible.builtin.dnf:
            name: "/tmp/vagrant.rpm"
            state: present
          when: ansible_os_family == "RedHat"

    - name: Verify installation
      ansible.builtin.command: vagrant --version
      register: vagrant_version_output
      changed_when: false

    - name: Show installed Vagrant version
      ansible.builtin.debug:
        msg: "Installed {{ vagrant_version_output.stdout }}"
