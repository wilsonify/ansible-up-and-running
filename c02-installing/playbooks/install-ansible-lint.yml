---
- name: Install ansible-lint via pipx
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install dependencies
      ansible.builtin.package:
        name: "{{ 'python3-pip' if ansible_os_family == 'Debian' else 'python3-pip,python3-pipx' }}"
        state: present

    - name: Install ansible-lint via pipx
      ansible.builtin.command: >
        pipx install ansible-lint --pip-args='--upgrade'
      environment:
        PIPX_HOME: /usr/local/pipx
        PIPX_BIN_DIR: /usr/local/bin
      args:
        creates: /usr/local/bin/ansible-lint

    - name: Verify ansible-lint installation
      ansible.builtin.command: ansible-lint --version
      register: lint_version
      changed_when: false

    - name: Show installed ansible-lint version
      ansible.builtin.debug:
        msg: "Installed {{ lint_version.stdout }}"
