---
- name: Configure webserver with Nginx and TLS
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    tls_dir: /etc/nginx/ssl/
    key_file: playbooks/files/nginx.key
    cert_file: playbooks/files/nginx.crt
    conf_file: /etc/nginx/sites-available/default
    server_name: localhost

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

  tasks:
    - name: Ensure nginx is installed
      ansible.builtin.package:
        name: nginx
        state: present
        update_cache: true
      notify: Restart nginx

    - name: Create directories for TLS certificates
      ansible.builtin.file:
        path: "{{ tls_dir }}"
        state: directory
        mode: "0750"
      notify: Restart nginx

    - name: Copy TLS files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ tls_dir }}"
        mode: "0600"
      loop:
        - "{{ key_file }}"
        - "{{ cert_file }}"
      notify: Restart nginx

    - name: Manage nginx config template
      ansible.builtin.template:
        src: playbooks/templates/nginx.conf.j2
        dest: "{{ conf_file }}"
        mode: "0644"
      notify: Restart nginx

    - name: Install home page
      ansible.builtin.template:
        src: playbooks/templates/index.html.j2
        dest: /usr/share/nginx/html/index.html
        mode: "0644"

    - name: Restart nginx
      ansible.builtin.meta: flush_handlers

    - name: "Test it! https://localhost:8443/index.html"
      ansible.builtin.uri:
        url: 'https://localhost:8443/index.html'
        validate_certs: false
        return_content: true
      delegate_to: localhost
      become: false
      register: this
      failed_when: "'Running on ' not in this.content"
      tags:
        - test
