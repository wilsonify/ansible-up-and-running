name: Build Ansible with PyInstaller

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel pyinstaller

      - name: Clone Ansible v2.19.0
        working-directory: c01-introduction
        run: |
          git clone https://github.com/ansible/ansible.git --recursive
          cd ansible
          git checkout v2.19.0
          git submodule update --init --recursive
          python -m pip install -e .
          python -m pip install -r requirements.txt
          cp ../build.spec ./build.spec

      - name: Source env-setup (Linux only)
        if: runner.os == 'Linux'
        working-directory: c01-introduction/ansible
        run: source hacking/env-setup
        shell: bash

      - name: Run PyInstaller build (Linux)
        if: runner.os == 'Linux'
        working-directory: c01-introduction/ansible
        run: pyinstaller build.spec

      - name: Run PyInstaller build (Windows)
        if: runner.os == 'Windows'
        working-directory: c01-introduction/ansible
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          LC_ALL: "C.UTF-8"
          LANG: "C.UTF-8"
        run: |
          chcp 65001
          pyinstaller build.spec

      - name: Archive build outputs (Linux)
        if: runner.os == 'Linux'
        run: |
          cd c01-introduction/ansible/dist
          tar -czf ansible-bundle-v2.19.0-linux.tar.gz ansible-bundle
          mv ansible-bundle-v2.19.0-linux.tar.gz $GITHUB_WORKSPACE/

      - name: Archive build outputs (Windows)
        if: runner.os == 'Windows'
        run: |
          cd c01-introduction/ansible/dist
          powershell Compress-Archive -Path ansible-bundle -DestinationPath ansible-bundle-v2.19.0-windows.zip
          mv ansible-bundle-v2.19.0-windows.zip $env:GITHUB_WORKSPACE\

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.19.0
          name: "Ansible PyInstaller v2.19.0"
          files: |
            ansible-bundle-v2.19.0-linux.tar.gz
            ansible-bundle-v2.19.0-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
